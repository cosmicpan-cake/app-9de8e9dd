name: Enable Pages

# One-shot diagnostic: asks the Pages API to create the site from master and
# surfaces the HTTP status + body as a job annotation, which is readable
# without signing in. Deleted again once we know the answer.

on:
  push:
    branches: [master]
    paths: [.github/workflows/pages-enable.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Create the Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
            -d '{"source":{"branch":"master","path":"/"}}')
          echo "status=$code"
          echo "body=$(cat /tmp/body.json)"
          echo "::error title=Pages API status $code::$(head -c 400 /tmp/body.json | tr '\n' ' ')"
