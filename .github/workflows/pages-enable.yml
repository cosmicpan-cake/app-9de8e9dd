name: Enable Pages

# One-shot: asks the Pages API to create the site from master, then prints the
# response so the run log shows whether the workflow token is allowed to do it.

on:
  push:
    branches: [master]
    paths: [.github/workflows/pages-enable.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Create the Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -w '\nHTTP %{http_code}\n' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
            -d '{"source":{"branch":"master","path":"/"}}'
